<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Vectorize AE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="panel">

    <section class="step">
      <h2 class="step__title">1 · Imagem</h2>

      <label id="dropzone" class="dropzone" for="file">
        <img id="preview" class="dropzone__preview" hidden alt="">
        <span class="dropzone__hint">Arraste uma imagem aqui<br>ou clique para escolher</span>
        <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
      </label>

      <p id="image-meta" class="meta"></p>
    </section>

    <section class="step">
      <h2 class="step__title">2 · Análise</h2>

      <label class="field">
        <span class="field__label">Dicas para o modelo</span>
        <textarea id="hints" rows="2"
          placeholder="ex: ignore o fundo · a fonte é Gilroy · o ícone é um path só"></textarea>
      </label>

      <label class="field field--inline">
        <span class="field__label">Esforço</span>
        <select id="effort">
          <option value="medium">médio — designs simples</option>
          <option value="high" selected>alto — padrão</option>
          <option value="xhigh">muito alto — designs densos</option>
        </select>
      </label>

      <button id="analyze" class="btn btn--primary" disabled>Analisar imagem</button>

      <div id="report" class="report" hidden></div>
    </section>

    <section class="step">
      <h2 class="step__title">3 · Construir no After Effects</h2>

      <label class="field field--inline">
        <span class="field__label">Camadas</span>
        <select id="layer-mode">
          <option value="per-group" selected>uma por grupo</option>
          <option value="per-element">uma por elemento</option>
        </select>
      </label>

      <label class="check">
        <input id="recenter" type="checkbox" checked>
        <span>Centralizar âncoras <em>(recomendado para animar)</em></span>
      </label>

      <label class="check">
        <input id="reuse-comp" type="checkbox">
        <span>Usar a comp ativa em vez de criar uma nova</span>
      </label>

      <label class="check">
        <input id="linear-gamma" type="checkbox">
        <span>Projeto em espaço linear <em>(se as cores saírem lavadas)</em></span>
      </label>

      <button id="build" class="btn btn--primary" disabled>Construir camadas</button>
    </section>

    <details id="settings" class="settings">
      <summary>Ajustes</summary>

      <label class="field">
        <span class="field__label">Chave da API da Anthropic</span>
        <input id="api-key" type="password" placeholder="sk-ant-…" autocomplete="off">
        <small class="field__note">
          Guardada só nesta máquina, no armazenamento local do painel. Nunca vai pro
          projeto do After Effects nem pro repositório.
        </small>
      </label>

      <label class="field">
        <span class="field__label">Modelo</span>
        <input id="model" type="text" spellcheck="false">
      </label>
    </details>

    <p id="status" class="status status--info">Carregando…</p>

  </main>

  <script src="js/panel.js"></script>
</body>
</html>
